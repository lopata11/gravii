<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Калькулятор</title>
    <!-- Подключаем файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <!-- Экран калькулятора -->
        <input type="text" id="display" disabled>
        
        <!-- Кнопки -->
        <div class="buttons">
            <button onclick="clearDisplay()" class="btn-red">C</button>
            <button onclick="appendToDisplay('/')" class="btn-op">/</button>
            <button onclick="appendToDisplay('*')" class="btn-op">*</button>
            <button onclick="deleteLast()" class="btn-op">←</button>

            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('-')" class="btn-op">-</button>

            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('+')" class="btn-op">+</button>

            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="calculate()" class="btn-equal">=</button>
            
            <button onclick="appendToDisplay('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendToDisplay('.')">.</button>
        </div>
    </div>

    <!-- Подключаем файл скриптов -->
    <script src="script.js"></script>
</body>
</html>
